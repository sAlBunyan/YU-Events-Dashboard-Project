<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YU Events Dashboard</title>

<style>
/* ---------- Colors ---------- */
:root {
  --bg: #ffffff;
  --surface: #fff8f2;
  --ink: #1c1612;
  --muted: #6b5f56;
  --line: #f0dccb;
  --accent: #f68938;
  --accent-light: #fbb98a;
  --good: #2b7a4b;
  --bad: #b3402f;

  --c-Orientation: #f68938;
  --c-Career: #2f80ed;
  --c-Technical: #8e5bd6;
  --c-Academic: #1fa37a;
  --c-Social: #e5484d;
}

:root[data-theme="dark"] {
  --bg: #0b0b0b;
  --surface: #181818;
  --ink: #f5efe9;
  --muted: #a89d93;
  --line: #2c2c2c;
  --accent-light: #fbb98a;
  --good: #6fcf97;
  --bad: #ef7d6b;

  --c-Orientation: #d9965b;
  --c-Career: #6b8fb5;
  --c-Technical: #8f7fb0;
  --c-Academic: #6fa38c;
  --c-Social: #bf7a78;
}

/* ---------- Page basics ---------- */
* { box-sizing: border-box; }

html {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.45;
  border-top: 6px solid var(--accent);
}

[hidden] { display: none !important; }

h1 { font-size: 1.6rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 8px; }

.page { padding: 12px clamp(16px, 3vw, 48px); }

/* ---------- Header bar ---------- */
.topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom: 3px solid var(--accent);
  border-radius: 10px;
}

.brand {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.logo {
  height: 40px;
  max-width: 100%;
  padding: 6px 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  object-fit: contain;
}

.badge {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font-size: 1.2rem;
  font-weight: 700;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 0.75rem;
  color: var(--muted);
}

/* ---------- Inputs and buttons ---------- */
select, input, button {
  padding: 8px 10px;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}

input { width: 100%; }
button { cursor: pointer; padding: 8px 12px; }

select:focus-visible, input:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1c1612;
  font-weight: 600;
}

/* Sun / moon slider */
.switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 66px;
  height: 36px;
  padding: 0 9px;
  border-radius: 18px;
}

.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform 0.2s;
}

.switch[aria-checked="true"]::after { transform: translateX(30px); }

.switch svg {
  position: relative;
  z-index: 1;
  width: 17px;
  height: 17px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 2;
}

.switch[aria-checked="false"] .sun,
.switch[aria-checked="true"] .moon { stroke: #fff; }

@media (prefers-reduced-motion: reduce) {
  .switch::after { transition: none; }
}

/* ---------- KPI cards ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 10px;
  margin-bottom: 10px;
}

.kpi, .card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.kpi { padding: 8px 12px; }
.kpi small { color: var(--muted); }
.kpi strong { display: block; font-size: 1.5rem; }
.kpi span { font-size: 0.85rem; }

.up { color: var(--good); }
.down { color: var(--bad); }

/* ---------- Main layout ---------- */
.main-grid {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: 12px;
  align-items: start;
}

.side { display: grid; gap: 12px; min-width: 0; }
.card { padding: 12px; min-width: 0; }

@media (max-width: 760px) {
  .main-grid { grid-template-columns: 1fr; }
}

/* ---------- Events table ---------- */
.table-wrap {
  overflow: auto;
  min-height: 260px;
  max-height: calc(100vh - 340px);
}

table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

th, td {
  padding: 5px 10px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}

th {
  position: sticky;
  top: 0;
  background: var(--surface);
  color: var(--muted);
  font-weight: 600;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  font-size: 0.78rem;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* ---------- Category bars ---------- */
.bar-row { margin-bottom: 7px; font-size: 0.9rem; }
.bar-top { display: flex; justify-content: space-between; }
.bar-name { display: flex; align-items: center; gap: 8px; }

.track {
  height: 8px;
  margin-top: 4px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
}

.fill { height: 100%; }

/* ---------- Rings ---------- */
.rings {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.legend-item { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.legend-item .dot { width: 14px; height: 14px; }
.legend-item small { display: block; color: var(--muted); }

/* ---------- Insight ---------- */
.insight {
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
}

/* ---------- Add event popup ---------- */
dialog {
  width: min(520px, 92vw);
  padding: 18px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
}

dialog::backdrop { background: rgba(0, 0, 0, 0.5); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--muted); }
.form-grid select { width: 100%; }
.form-error { min-height: 1.2em; margin: 8px 0 0; font-size: 0.85rem; color: var(--bad); }
.form-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <img id="logo" class="logo" alt="Al Yamamah University logo" hidden>
      <div id="logo-fallback" class="badge">YU</div>
      <h1>YU Events Dashboard</h1>
    </div>

    <div class="controls">
      <label class="field">Category
        <select id="category-filter"></select>
      </label>
      <label class="field">Month
        <select id="month-filter">
          <option value="All">Whole semester</option>
          <option>Sep</option>
          <option>Oct</option>
          <option>Nov</option>
          <option>Dec</option>
        </select>
      </label>
      <button id="add-button" class="primary" type="button">+ Add event</button>
      <button id="theme-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
        <svg class="sun" viewBox="0 0 24 24" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" stroke-linejoin="round">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <section id="kpis" class="kpis"></section>

  <section class="main-grid">
    <div class="card">
      <h2>Events</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>Category</th>
              <th>Month</th>
              <th>Registered</th>
              <th>Attended</th>
              <th>Cost (SAR)</th>
            </tr>
          </thead>
          <tbody id="events-body"></tbody>
        </table>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <h2>Attendance rate by category</h2>
        <div id="category-bars"></div>
      </div>
      <div class="card">
        <h2>Performance rings</h2>
        <div id="rings" class="rings"></div>
      </div>
    </div>
  </section>

  <div id="insight" class="insight"></div>

</div>

<dialog id="dialog">
  <h2>Add an event</h2>
  <div class="form-grid">
    <label>Event name <input id="new-name" type="text"></label>
    <label>Category <select id="new-category"></select></label>
    <label>Month
      <select id="new-month">
        <option>Sep</option>
        <option>Oct</option>
        <option>Nov</option>
        <option>Dec</option>
      </select>
    </label>
    <label>Capacity <input id="new-capacity" type="number" min="1"></label>
    <label>Registered <input id="new-registered" type="number" min="0"></label>
    <label>Attended <input id="new-attended" type="number" min="0"></label>
    <label>Cost (SAR) <input id="new-cost" type="number" min="0"></label>
  </div>
  <p id="form-error" class="form-error"></p>
  <div class="form-buttons">
    <button id="cancel-button" type="button">Cancel</button>
    <button id="save-button" class="primary" type="button">Save event</button>
  </div>
</dialog>

<script>
// ---------- Settings ----------
const BUDGET = 150000; // semester budget in SAR
const CATEGORIES = ["Orientation", "Career", "Technical", "Academic", "Social"];

// ---------- Event data (add or edit events here) ----------
const events = [
  { name: "Welcome Day",             category: "Orientation", month: "Sep", capacity: 500, registered: 480, attended: 430, cost: 12000 },
  { name: "Career Fair",             category: "Career",      month: "Oct", capacity: 400, registered: 390, attended: 360, cost: 18000 },
  { name: "Hackathon",               category: "Technical",   month: "Oct", capacity: 120, registered: 110, attended: 95,  cost: 9000 },
  { name: "Business Talk",           category: "Academic",    month: "Oct", capacity: 200, registered: 150, attended: 105, cost: 4000 },
  { name: "Sports Day",              category: "Social",      month: "Nov", capacity: 300, registered: 280, attended: 240, cost: 7500 },
  { name: "Research Forum",          category: "Academic",    month: "Nov", capacity: 150, registered: 90,  attended: 60,  cost: 5000 },
  { name: "Cyber Security Workshop", category: "Technical",   month: "Nov", capacity: 80,  registered: 80,  attended: 72,  cost: 3500 },
  { name: "National Day Event",      category: "Social",      month: "Sep", capacity: 600, registered: 560, attended: 520, cost: 15000 },
  { name: "CV Clinic",               category: "Career",      month: "Dec", capacity: 100, registered: 85,  attended: 70,  cost: 2000 },
  { name: "Graduation Prep Talk",    category: "Orientation", month: "Dec", capacity: 250, registered: 140, attended: 95,  cost: 3000 },
  { name: "Freshers Mixer",          category: "Social",      month: "Sep", capacity: 200, registered: 190, attended: 170, cost: 5000 },
  { name: "Study Skills Workshop",   category: "Academic",    month: "Sep", capacity: 100, registered: 70,  attended: 50,  cost: 1500 },
  { name: "AI Bootcamp",             category: "Technical",   month: "Sep", capacity: 100, registered: 100, attended: 88,  cost: 6000 },
  { name: "Internship Info Session", category: "Career",      month: "Sep", capacity: 150, registered: 130, attended: 105, cost: 2500 },
  { name: "Library Orientation",     category: "Orientation", month: "Oct", capacity: 150, registered: 90,  attended: 62,  cost: 1000 },
  { name: "Alumni Networking Night", category: "Career",      month: "Nov", capacity: 120, registered: 100, attended: 85,  cost: 6500 },
  { name: "Cultural Festival",       category: "Social",      month: "Dec", capacity: 500, registered: 450, attended: 390, cost: 14000 },
  { name: "Exam Prep Seminar",       category: "Academic",    month: "Dec", capacity: 200, registered: 160, attended: 120, cost: 2500 },
  { name: "Data Analytics Workshop", category: "Technical",   month: "Dec", capacity: 90,  registered: 85,  attended: 76,  cost: 3000 }
];

// ---------- Small helpers ----------
function $(id) {
  return document.getElementById(id);
}

function total(list, field) {
  return list.reduce((sum, event) => sum + event[field], 0);
}

function formatNumber(number) {
  return Math.round(number).toLocaleString("en-US");
}

function categoryColor(category) {
  return "var(--c-" + category + ")";
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// ---------- Filtering and numbers ----------
function getMonthEvents() {
  const month = $("month-filter").value;
  return events.filter(event => month === "All" || event.month === month);
}

function getSelectedEvents() {
  const category = $("category-filter").value;
  return getMonthEvents().filter(event => category === "All" || event.category === category);
}

function getStats(list) {
  const attended = total(list, "attended");
  const registered = total(list, "registered");
  const capacity = total(list, "capacity");
  const cost = total(list, "cost");

  return {
    count: list.length,
    attended: attended,
    cost: cost,
    showUpRate: registered ? (attended / registered) * 100 : 0,
    capacityFilled: capacity ? (attended / capacity) * 100 : 0,
    costPerAttendee: attended ? cost / attended : 0
  };
}

// ---------- Drawing the dashboard ----------
function renderKpis(stats) {
  const cards = [
    { label: "Events held", value: stats.count, note: "in selection", status: "" },
    { label: "Total attendance", value: formatNumber(stats.attended), note: stats.capacityFilled.toFixed(0) + "% of capacity", status: stats.capacityFilled >= 70 ? "up" : "down" },
    { label: "Show-up rate", value: stats.showUpRate.toFixed(0) + "%", note: "target 85%", status: stats.showUpRate >= 85 ? "up" : "down" },
    { label: "Cost per attendee", value: formatNumber(stats.costPerAttendee) + " SAR", note: "total " + formatNumber(stats.cost) + " SAR", status: "" }
  ];

  $("kpis").innerHTML = cards.map(card =>
    '<div class="kpi">' +
      "<small>" + card.label + "</small>" +
      "<strong>" + card.value + "</strong>" +
      '<span class="' + card.status + '">' + card.note + "</span>" +
    "</div>"
  ).join("");
}

function renderRings(stats) {
  const budgetUsed = (stats.cost / BUDGET) * 100;

  const rings = [
    { label: "Show-up rate", percent: stats.showUpRate, note: "goal 85%", color: "var(--accent)" },
    { label: "Capacity filled", percent: stats.capacityFilled, note: "goal 70%", color: "var(--accent-light)" },
    { label: "Budget used", percent: budgetUsed, note: formatNumber(stats.cost) + " of " + formatNumber(BUDGET) + " SAR", color: "var(--ink)" }
  ];

  let svg = '<svg viewBox="0 0 200 200" width="150" height="150" role="img" aria-label="Progress rings for show-up rate, capacity and budget">';

  rings.forEach((ring, index) => {
    const radius = 88 - index * 22;
    const circumference = 2 * Math.PI * radius;
    const progress = Math.max(0, Math.min(1, ring.percent / 100));

    svg += '<circle cx="100" cy="100" r="' + radius + '" fill="none" stroke-width="16" style="stroke:' + ring.color + '; stroke-opacity:0.18"/>';

    if (progress > 0) {
      svg += '<circle cx="100" cy="100" r="' + radius + '" fill="none" stroke-width="16" stroke-linecap="round"' +
             ' stroke-dasharray="' + circumference * progress + " " + circumference + '"' +
             ' transform="rotate(-90 100 100)" style="stroke:' + ring.color + '"/>';
    }
  });

  svg += "</svg>";

  const legend = rings.map(ring =>
    '<div class="legend-item">' +
      '<span class="dot" style="background:' + ring.color + '"></span>' +
      "<span><strong>" + ring.label + ": " + ring.percent.toFixed(0) + "%</strong><small>" + ring.note + "</small></span>" +
    "</div>"
  ).join("");

  $("rings").innerHTML = svg + "<div>" + legend + "</div>";
}

function renderCategoryBars() {
  const monthEvents = getMonthEvents();

  $("category-bars").innerHTML = CATEGORIES.map(category => {
    const list = monthEvents.filter(event => event.category === category);
    const registered = total(list, "registered");
    const rate = registered ? (total(list, "attended") / registered) * 100 : 0;

    return '<div class="bar-row">' +
      '<div class="bar-top">' +
        '<span class="bar-name"><span class="dot" style="background:' + categoryColor(category) + '"></span>' + category + "</span>" +
        "<strong>" + rate.toFixed(0) + "%</strong>" +
      "</div>" +
      '<div class="track"><div class="fill" style="width:' + rate + "%; background:" + categoryColor(category) + '"></div></div>' +
    "</div>";
  }).join("");
}

function renderTable(list) {
  if (list.length === 0) {
    $("events-body").innerHTML = '<tr><td colspan="6">No events match. Change the filters.</td></tr>';
    return;
  }

  $("events-body").innerHTML = list.map(event => {
    const color = categoryColor(event.category);
    const tag = '<span class="tag" style="background: color-mix(in srgb, ' + color + ' 15%, transparent); border-color: ' + color + '">' +
                '<span class="dot" style="background:' + color + '"></span>' + event.category + "</span>";

    return "<tr>" +
      "<td>" + escapeHtml(event.name) + "</td>" +
      "<td>" + tag + "</td>" +
      "<td>" + event.month + "</td>" +
      "<td>" + event.registered + "</td>" +
      "<td>" + event.attended + "</td>" +
      "<td>" + formatNumber(event.cost) + "</td>" +
    "</tr>";
  }).join("");
}

function renderInsight(list) {
  const lowEvents = list.filter(event => event.attended / event.registered < 0.75).map(event => escapeHtml(event.name));

  if (lowEvents.length > 0) {
    $("insight").innerHTML = "<b>Insight:</b> Low show-up (under 75%): " + lowEvents.join(", ") +
                             ". Recommendation: send reminders and move these events to peak months.";
  } else {
    $("insight").innerHTML = "<b>Insight:</b> No event is below the 75% show-up threshold in this selection. Keep the current schedule.";
  }
}

function render() {
  const selected = getSelectedEvents();
  const stats = getStats(selected);

  renderKpis(stats);
  renderRings(stats);
  renderCategoryBars();
  renderTable(selected);
  renderInsight(selected);
}

// ---------- Light / dark mode ----------
function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  $("theme-switch").setAttribute("aria-checked", theme === "dark");
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
}

// ---------- Add event popup ----------
function openDialog() {
  ["new-name", "new-capacity", "new-registered", "new-attended", "new-cost"].forEach(id => {
    $(id).value = "";
  });
  $("form-error").textContent = "";
  $("dialog").showModal();
}

function saveEvent() {
  const name = $("new-name").value.trim();
  const capacity = Number($("new-capacity").value);
  const registered = Number($("new-registered").value);
  const attended = Number($("new-attended").value);
  const cost = Number($("new-cost").value);

  let error = "";
  if (!name) error = "Enter an event name.";
  else if (capacity <= 0) error = "Capacity must be more than 0.";
  else if ($("new-registered").value === "" || registered < 0 || registered > capacity) error = "Registered must be between 0 and the capacity.";
  else if ($("new-attended").value === "" || attended < 0 || attended > registered) error = "Attended can’t be more than registered.";
  else if ($("new-cost").value === "" || cost < 0) error = "Enter the cost (0 or more).";

  if (error) {
    $("form-error").textContent = error;
    return;
  }

  events.unshift({
    name: name,
    category: $("new-category").value,
    month: $("new-month").value,
    capacity: capacity,
    registered: registered,
    attended: attended,
    cost: cost
  });

  $("category-filter").value = "All";
  $("month-filter").value = "All";
  $("dialog").close();
  render();
}

// ---------- Start ----------
function start() {
  $("category-filter").innerHTML = '<option value="All">All categories</option>';
  CATEGORIES.forEach(category => {
    $("category-filter").innerHTML += "<option>" + category + "</option>";
    $("new-category").innerHTML += "<option>" + category + "</option>";
  });

  if (LOGO) {
    $("logo").src = LOGO;
    $("logo").hidden = false;
    $("logo-fallback").hidden = true;
  }

  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(prefersDark ? "dark" : "light");

  $("theme-switch").onclick = toggleTheme;
  $("category-filter").onchange = render;
  $("month-filter").onchange = render;
  $("add-button").onclick = openDialog;
  $("cancel-button").onclick = () => $("dialog").close();
  $("save-button").onclick = saveEvent;

  render();
}
